services:
  namenode:
    build:
      context: .
      dockerfile: Dockerfile.hadoop
      args:
        HADOOP_VERSION: ${HADOOP_VERSION:-3.2.1}
    image: crop-recommendation-hadoop:${HADOOP_VERSION:-3.2.1}
    hostname: namenode
    command: ["/bin/bash", "/opt/docker/scripts/start-hadoop.sh", "namenode"]
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - namenode-data:${HDFS_NAMENODE_DIR:-/data/dfs/name}
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
      - ./scripts:/opt/docker/scripts:ro
    environment:
      HDFS_NAMENODE_DIR: ${HDFS_NAMENODE_DIR:-/data/dfs/name}
      HDFS_REPLICATION: ${HDFS_REPLICATION:-1}
      CLUSTER_NAME: crop-recommendation
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9870/jmx?qry=Hadoop:service=NameNode,name=NameNodeStatus | grep -q '\"active\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  datanode:
    image: crop-recommendation-hadoop:${HADOOP_VERSION:-3.2.1}
    hostname: datanode
    command: ["/bin/bash", "/opt/docker/scripts/start-hadoop.sh", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "9864:9864"
    volumes:
      - datanode-data:${HDFS_DATANODE_DIR:-/data/dfs/data}
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
      - ./scripts:/opt/docker/scripts:ro
    environment:
      HDFS_DATANODE_DIR: ${HDFS_DATANODE_DIR:-/data/dfs/data}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9864/jmx | grep -q DataNodeInfo"]
      interval: 10s
      timeout: 5s
      retries: 18

  hdfs-bootstrap:
    image: crop-recommendation-hadoop:${HADOOP_VERSION:-3.2.1}
    command: ["/bin/bash", "/opt/docker/scripts/bootstrap-hdfs.sh"]
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
      - ./scripts:/opt/docker/scripts:ro

  resourcemanager:
    image: crop-recommendation-hadoop:${HADOOP_VERSION:-3.2.1}
    hostname: resourcemanager
    command: ["/bin/bash", "/opt/docker/scripts/start-hadoop.sh", "resourcemanager"]
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "8088:8088"
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
      - ./scripts:/opt/docker/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/ws/v1/cluster/info | grep -q STARTED"]
      interval: 10s
      timeout: 5s
      retries: 18

  nodemanager:
    image: crop-recommendation-hadoop:${HADOOP_VERSION:-3.2.1}
    hostname: nodemanager
    command: ["/bin/bash", "/opt/docker/scripts/start-hadoop.sh", "nodemanager"]
    depends_on:
      resourcemanager:
        condition: service_healthy
    ports:
      - "8042:8042"
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
      - ./scripts:/opt/docker/scripts:ro

  postgres:
    image: postgres:13-alpine
    hostname: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metastore}
      POSTGRES_USER: ${POSTGRES_USER:-hive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  hive-metastore:
    build:
      context: .
      dockerfile: Dockerfile.hive
      args:
        HADOOP_VERSION: ${HADOOP_VERSION:-3.2.1}
        HIVE_VERSION: ${HIVE_VERSION:-3.1.3}
    image: crop-recommendation-hive:${HIVE_VERSION:-3.1.3}
    hostname: hive-metastore
    command: ["/bin/bash", "/opt/docker/scripts/start-hive.sh", "metastore"]
    depends_on:
      namenode:
        condition: service_healthy
      hdfs-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "9083:9083"
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
      - ./config/hive:/opt/hive/conf:ro
      - ./scripts:/opt/docker/scripts:ro
    environment:
      HIVE_METASTORE_DB_PASSWORD: ${HIVE_METASTORE_DB_PASSWORD:?Set HIVE_METASTORE_DB_PASSWORD in .env}
      HIVE_METASTORE_DB_NAME: ${POSTGRES_DB:-metastore}
      HIVE_METASTORE_DB_USER: ${POSTGRES_USER:-hive}
      HADOOP_USER_NAME: hadoop
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9083"]
      interval: 5s
      timeout: 5s
      retries: 20

  hiveserver2:
    image: crop-recommendation-hive:${HIVE_VERSION:-3.1.3}
    hostname: hiveserver2
    command: ["/bin/bash", "/opt/docker/scripts/start-hive.sh", "hiveserver2"]
    depends_on:
      hive-metastore:
        condition: service_healthy
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
      - ./config/hive:/opt/hive/conf:ro
      - ./scripts:/opt/docker/scripts:ro
    environment:
      HIVE_METASTORE_DB_PASSWORD: ${HIVE_METASTORE_DB_PASSWORD:?Set HIVE_METASTORE_DB_PASSWORD in .env}
      HIVE_METASTORE_DB_NAME: ${POSTGRES_DB:-metastore}
      HIVE_METASTORE_DB_USER: ${POSTGRES_USER:-hive}
      HADOOP_USER_NAME: hadoop

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
      args:
        HADOOP_VERSION: ${HADOOP_VERSION:-3.2.1}
        SPARK_VERSION: ${SPARK_VERSION:-3.1.2}
    image: crop-recommendation-spark:${SPARK_VERSION:-3.1.2}
    hostname: spark-master
    command: ["/bin/bash", "/opt/docker/scripts/start-spark.sh", "master"]
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
      - ./config/spark:/opt/spark/conf:ro
      - ./scripts:/opt/docker/scripts:ro

  spark-worker:
    image: crop-recommendation-spark:${SPARK_VERSION:-3.1.2}
    hostname: spark-worker
    command: ["/bin/bash", "/opt/docker/scripts/start-spark.sh", "worker"]
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./config/hadoop:/opt/hadoop/etc/hadoop:ro
      - ./config/spark:/opt/spark/conf:ro
      - ./scripts:/opt/docker/scripts:ro
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g

volumes:
  namenode-data:
  datanode-data:
  postgres-data:
